name: Run AI Intelligence Pipeline

on:
  # Run every day at 08:00 UTC — full pipeline (papers+startups+products+news+jobs)
  # so the Google Sheet always has ALL data, not just freshness.
  schedule:
    - cron: "0 8 * * *"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      phase:
        description: "Pipeline phase to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - freshness
          - papers
          - startups
          - products

env:
  PYTHONUNBUFFERED: "1"

jobs:
  pipeline:
    name: Run ${{ github.event.inputs.phase || 'all' }} phase
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache SQLite database
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/pipeline.db
          key: pipeline-db-v1

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps 2>/dev/null || true

      - name: Write service account JSON
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          mkdir -p credentials
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 --decode > credentials/oauth_client.json
          echo "Service account JSON written."

      - name: Configure environment
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "GOOGLE_SERVICE_ACCOUNT_JSON=./credentials/oauth_client.json"
            echo "GOOGLE_SHEETS_ID=$GOOGLE_SHEETS_ID"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "GROQ_API_KEY=$GROQ_API_KEY"
            echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY"
            echo "GITHUB_TOKEN=$GITHUB_TOKEN"
          } >> $GITHUB_ENV
          echo ".env configured from GitHub Secrets."

      - name: Run pipeline phase
        run: |
          PHASE="${{ github.event.inputs.phase || 'all' }}"
          echo "Running phase: $PHASE"
          python -m src.pipeline.main --phase "$PHASE"

      - name: Export to Google Sheets
        run: python scripts/export_to_sheets.py

      - name: Export to CSV
        run: python scripts/export_to_csv.py

      - name: Commit updated CSVs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/exports/ || true
          if [ -n "$(git status --porcelain data/exports/)" ]; then
            git commit -m "chore: auto-update exports $(date -u '+%Y-%m-%d %H:%M UTC')" || true
            git push || echo "Push skipped (no changes or credentials)"
          else
            echo "No CSV changes to commit."
          fi

      - name: Post-result summary
        run: |
          echo ""
          echo "========================================"
          echo "Pipeline run complete!"
          echo "Phase: ${{ github.event.inputs.phase || 'all' }}"
          echo "Triggered by: ${{ github.trigger_event }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "========================================"
          echo ""
          echo "DB cache hit: ${{ steps.cache-db.outputs.cache-hit }}"
          echo "Google Sheet: https://docs.google.com/spreadsheets/d/${{ secrets.GOOGLE_SHEETS_ID }}"
